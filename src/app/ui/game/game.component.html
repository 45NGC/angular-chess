<div class="board">
  <div class="rank" *ngFor="let rank of ranks">
    <div
      class="square"
      [class.dark]="(rank + file) % 2 === 0"
      [class.light]="(rank + file) % 2 !== 0"
      [class.legal]="isLegalTarget(rank * 8 + file)"
      *ngFor="let file of files"
      (click)="onSquareClick(rank, file)"
    >
      <img
        *ngIf="state.board.get(rank * 8 + file) as piece"
        [src]="pieceToImage(piece)"
        class="piece"
      />
    </div>
  </div>

  <div class="modal-overlay" *ngIf="showGameOverModal" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h2>GAME OVER</h2>

      <div class="result-message">
        {{ getResultMessage() }}
      </div>

      <div class="modal-actions">
        <button class="btn-primary" (click)="resetGame()">RESTART</button>
        <button class="btn-secondary" (click)="closeModal()">EXIT</button>
      </div>
    </div>
  </div>
</div>

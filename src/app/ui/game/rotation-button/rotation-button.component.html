<button type="button" class="btn btn--success btn--square btn--auto" (click)="rotate.emit()">
  ROTATE
</button>

@if (autoRotateVisible) {
  <button
    type="button"
    class="btn btn--square btn--auto"
    [class.btn--success]="autoRotateEnabled"
    [class.btn--neutral]="!autoRotateEnabled"
    (click)="toggleAutoRotate.emit()"
  >
    AUTO: {{ autoRotateEnabled ? 'ON' : 'OFF' }}
  </button>
}

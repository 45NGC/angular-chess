<div class="home">
  <h1>Chess</h1>

  <button type="button" class="btn btn--success btn--wide" (click)="play('local')">Local</button>
  <button type="button" class="btn btn--success btn--wide" (click)="play('online')">Online</button>
  <button type="button" class="btn btn--success btn--wide" (click)="play('ai')">AI</button>
</div>

@if (showTimeControlDialog) {
  <app-time-control-settings-dialog
    [initial]="lastTimeControl"
    (confirm)="onTimeControlConfirm($event)"
    (cancel)="onTimeControlCancel()"
  ></app-time-control-settings-dialog>
}

@if (showAiModeDialog) {
  <app-ai-mode-settings-dialog
    [initial]="lastAiMode"
    (confirm)="onAiModeConfirm($event)"
    (cancel)="onAiModeCancel()"
  ></app-ai-mode-settings-dialog>
}

@if (showOnlineLobbyDialog) {
  <app-online-lobby-dialog
    [initialTimeControl]="lastTimeControl"
    (close)="onOnlineLobbyClose()"
    (timeControlChange)="onOnlineTimeControlChange($event)"
  ></app-online-lobby-dialog>
}

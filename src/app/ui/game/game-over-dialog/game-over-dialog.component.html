<div class="gameover-overlay" (click)="onExit()">
  <div class="gameover-container" (click)="$event.stopPropagation()">
    <div class="title">GAME OVER</div>

    <div class="result-message">
      {{ message }}
    </div>

    <div class="actions-container">
      <button type="button" class="btn btn--success action-option" (click)="onRestart()">
        RESTART
      </button>

      <button type="button" class="btn btn--danger action-option exit-option" (click)="onExit()">
        EXIT
      </button>
    </div>
  </div>
</div>

<div class="overlay" (click)="onCancel()">
  <div
    class="container"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ai-mode-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <div class="title" id="ai-mode-dialog-title">AI GAME SETTINGS</div>
    <div class="subtitle">Select difficulty and your color</div>

    <div class="section">
      <div class="section-title">Difficulty</div>

      <div class="options-grid">
        @for (level of levels; track level.key) {
          <button
            type="button"
            class="option"
            [class.selected]="level.key === selectedDifficulty"
            [attr.aria-pressed]="level.key === selectedDifficulty"
            (click)="selectDifficulty(level.key)"
          >
            {{ level.label }}
          </button>
        }
      </div>
    </div>

    <div class="section">
      <div class="section-title">Your color</div>

      <div class="options-grid color-grid">
        @for (color of colors; track color.key) {
          <button
            type="button"
            class="option"
            [class.selected]="color.key === selectedPlayerColor"
            [attr.aria-pressed]="color.key === selectedPlayerColor"
            (click)="selectPlayerColor(color.key)"
          >
            {{ color.label }}
          </button>
        }
      </div>
    </div>

    <div class="summary">{{ summary }}</div>

    <div class="actions">
      <button type="button" class="btn btn--success" (click)="onConfirm()">START</button>
      <button type="button" class="btn btn--danger" (click)="onCancel()">CANCEL</button>
    </div>
  </div>
</div>

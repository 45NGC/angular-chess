<div class="game-container" *ngIf="gameService; else loading">
  <div class="board">
    <div class="rank" *ngFor="let rank of ranks">
      <div
        class="square"
        [class.dark]="(rank + file) % 2 === 0"
        [class.light]="(rank + file) % 2 !== 0"
        [class.legal]="isLegalTarget(rank * 8 + file)"
        *ngFor="let file of files"
        (click)="onSquareClick(rank, file)"
      >
        <img
          *ngIf="state?.board?.get(rank * 8 + file) as piece"
          [src]="pieceToImage(piece)"
          class="piece"
        />
      </div>
    </div>

    <app-game-over-dialog
      *ngIf="showGameOverDialog"
      [message]="getResultMessage()"
      (restart)="onRestart()"
      (exit)="onExit()"
    >
    </app-game-over-dialog>
  </div>

  <div class="promotion-side-panel" *ngIf="showPromotionDialog">
    <app-promotion-dialog
      [color]="state!.turn"
      (selected)="onPromotionSelected($event)"
      (close)="closePromotionDialog()"
    >
    </app-promotion-dialog>
  </div>
</div>

<ng-template #loading>
  <p>Loading...</p>
</ng-template>

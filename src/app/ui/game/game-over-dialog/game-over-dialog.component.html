<div class="gameover-overlay" (click)="onClose()">
  <div class="gameover-container" (click)="$event.stopPropagation()">
    <div class="title">GAME OVER</div>

    <div class="result-message">
      {{ message }}
    </div>

    <div class="actions-container">
      <app-restart-button class="gameover-action" (restart)="restart.emit()" />

      <button type="button" class="btn btn--danger gameover-action" (click)="onExit()">
        QUIT
      </button>
    </div>
  </div>
</div>

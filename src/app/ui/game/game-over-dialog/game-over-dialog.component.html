<div class="gameover-overlay" (click)="onExit()">
  <div class="gameover-container" (click)="$event.stopPropagation()">
    <div class="title">GAME OVER</div>

    <div class="result-message">
      {{ message }}
    </div>

    <div class="actions-container">
      <div class="action-option" (click)="onRestart()">
        ↻
        <span>RESTART</span>
      </div>

      <div class="action-option exit-option" (click)="onExit()">
        ✕
        <span>EXIT</span>
      </div>
    </div>
  </div>
</div>
